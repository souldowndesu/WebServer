<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>服务器连接测试</title>
  <style>
    :root {
      --bg: #0c0d0f;
      --surface: #131518;
      --surface-hover: #1b1e22;
      --text: #f4f5f6;
      --muted: #969ca5;
      --faint: #69707a;
      --border: #2a2e34;
      --border-strong: #3b4149;
      --accent: #82d9a0;
      --accent-ink: #07130b;
      --danger: #ff8a8a;
      --focus: #b9e8c8;
      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 24px;
      --s6: 32px;
      --r1: 6px;
      --r2: 10px;
      --r3: 16px;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); color: var(--text); font-family: var(--sans); }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--bg); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .shell { min-height: 100vh; }
    .clock-stage {
      position: relative;
      display: grid;
      min-height: 100vh;
      padding: 96px 416px 96px 48px;
      place-items: center;
    }
    .eyebrow {
      position: absolute;
      top: var(--s5);
      left: var(--s5);
      display: flex;
      align-items: center;
      gap: var(--s3);
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .eyebrow::before { width: 32px; height: 1px; background: var(--border-strong); content: ""; }
    .clock-block { width: min(100%, 760px); text-align: center; }
    .clock {
      margin: 0;
      font-family: var(--mono);
      font-size: clamp(64px, 10vw, 136px);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      letter-spacing: -.07em;
      line-height: .95;
      text-indent: -.07em;
    }
    .date { margin: var(--s5) 0 0; color: var(--muted); font-size: clamp(14px, 1.5vw, 18px); }
    .timezone { margin: var(--s2) 0 0; color: var(--faint); font: 12px var(--mono); }
    .health {
      position: absolute;
      bottom: var(--s5);
      left: var(--s5);
      display: flex;
      align-items: center;
      gap: var(--s2);
      min-height: 28px;
      color: var(--muted);
      font-size: 12px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    [data-state="online"] .dot, .connection[data-state="online"]::before { background: var(--accent); }
    .health[data-state="error"], .connection[data-state="error"], .form-status[data-state="error"] { color: var(--danger); }
    .health[data-state="error"] .dot, .connection[data-state="error"]::before { background: var(--danger); }
    .chat {
      position: fixed;
      z-index: 2;
      top: var(--s5);
      right: var(--s5);
      bottom: var(--s5);
      display: grid;
      width: 368px;
      min-height: 420px;
      overflow: hidden;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r3);
      box-shadow: 0 20px 60px rgb(0 0 0 / 28%);
    }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 0 var(--s4);
      border-bottom: 1px solid var(--border);
    }
    .chat-title { margin: 0; font-size: 14px; font-weight: 650; }
    .connection { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
    .connection::before { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); content: ""; }
    .messages { overflow-y: auto; padding: var(--s2) var(--s4); overscroll-behavior: contain; }
    .empty {
      display: grid;
      min-height: 100%;
      padding: var(--s6);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
      place-items: center;
      text-align: center;
    }
    .message { padding: var(--s4) 0; border-bottom: 1px solid var(--border); }
    .message:last-child { border-bottom: 0; }
    .meta { display: flex; justify-content: space-between; gap: var(--s3); margin-bottom: 6px; }
    .author { overflow: hidden; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .sent-at { flex: none; color: var(--faint); font: 10px var(--mono); }
    .message-text {
      margin: 0;
      overflow-wrap: anywhere;
      color: #d7dade;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .composer { display: grid; gap: var(--s3); padding: var(--s4); border-top: 1px solid var(--border); }
    .identity { display: flex; align-items: center; gap: var(--s2); }
    label { flex: none; color: var(--muted); font-size: 11px; }
    .name, .message-input {
      width: 100%;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: var(--r1);
      transition: border-color 120ms ease, background 120ms ease;
    }
    .name:hover, .message-input:hover { border-color: #535a64; }
    .name:focus, .message-input:focus { background: #101215; border-color: var(--focus); outline: none; }
    .name { height: 32px; padding: 0 10px; font-size: 12px; }
    .compose-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s2); }
    .message-input { min-height: 40px; padding: 0 var(--s3); font-size: 13px; }
    .send {
      min-width: 64px;
      min-height: 40px;
      padding: 0 var(--s4);
      color: var(--accent-ink);
      font-size: 12px;
      font-weight: 700;
      background: var(--accent);
      border: 0;
      border-radius: var(--r2);
      transition: filter 120ms ease, transform 120ms ease;
    }
    .send:hover { filter: brightness(1.08); }
    .send:active { transform: translateY(1px); }
    .send:disabled { cursor: not-allowed; filter: grayscale(.8); opacity: .5; }
    .form-status { min-height: 15px; margin: 0; color: var(--muted); font-size: 10px; }
    @media (max-width: 900px) {
      .clock-stage { min-height: 56vh; padding: 80px var(--s5) 56px; }
      .clock { font-size: clamp(54px, 16vw, 104px); }
      .chat { position: relative; inset: auto; width: auto; height: min(560px, 74vh); margin: 0 var(--s4) var(--s4); }
      .health { right: var(--s5); left: auto; }
    }
    @media (max-width: 520px) {
      .clock-stage { min-height: 48vh; padding-right: var(--s4); padding-left: var(--s4); }
      .eyebrow { top: var(--s4); left: var(--s4); }
      .health { right: var(--s4); bottom: var(--s4); }
      .clock { font-size: clamp(48px, 18vw, 76px); }
      .chat {
        height: 64vh;
        min-height: 440px;
        margin: 0;
        border-right: 0;
        border-bottom: 0;
        border-left: 0;
        border-radius: var(--r3) var(--r3) 0 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="clock-stage" aria-labelledby="clock-label">
      <div class="eyebrow" id="clock-label">Server visibility test</div>
      <div class="clock-block">
        <p class="clock" id="clock">--:--:--</p>
        <p class="date" id="date">正在读取本地时间…</p>
        <p class="timezone" id="timezone"></p>
      </div>
      <div class="health" id="health" data-state="checking" role="status">
        <span class="dot" aria-hidden="true"></span><span id="health-text">正在检查服务器</span>
      </div>
    </section>
    <aside class="chat" aria-labelledby="chat-title">
      <header class="chat-header">
        <h1 class="chat-title" id="chat-title">连接测试聊天室</h1>
        <span class="connection" id="connection" data-state="checking">连接中</span>
      </header>
      <section class="messages" id="messages" aria-live="polite" aria-label="聊天消息">
        <div class="empty" id="empty">还没有消息。<br>从网页或本地工具发送第一条连接测试。</div>
      </section>
      <form class="composer" id="chat-form">
        <div class="identity">
          <label for="author">昵称</label>
          <input class="name" id="author" maxlength="40" value="网页访客" autocomplete="nickname">
        </div>
        <div class="compose-row">
          <input class="message-input" id="message" maxlength="500" placeholder="输入测试消息…" autocomplete="off" required>
          <button class="send" id="send" type="submit">发送</button>
        </div>
        <p class="form-status" id="form-status" role="status">消息仅保存在服务器内存中</p>
      </form>
    </aside>
  </main>
  <script>
    (function () {
      "use strict";
      var byId = function (id) { return document.getElementById(id); };
      var clock = byId("clock"), date = byId("date"), timezone = byId("timezone");
      var health = byId("health"), healthText = byId("health-text"), connection = byId("connection");
      var messages = byId("messages"), empty = byId("empty"), form = byId("chat-form");
      var authorInput = byId("author"), messageInput = byId("message");
      var send = byId("send"), formStatus = byId("form-status");
      var lastId = 0, seen = new Set();
      var tf = new Intl.DateTimeFormat("zh-CN", {hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false});
      var df = new Intl.DateTimeFormat("zh-CN", {year: "numeric", month: "long", day: "numeric", weekday: "long"});
      function updateClock() {
        var now = new Date();
        clock.textContent = tf.format(now);
        date.textContent = df.format(now);
        timezone.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;
      }
      function setConnection(state, text) { connection.dataset.state = state; connection.textContent = text; }
      function render(item) {
        if (seen.has(item.id)) return;
        seen.add(item.id);
        lastId = Math.max(lastId, item.id);
        if (empty) { empty.remove(); empty = null; }
        var article = document.createElement("article"), meta = document.createElement("div");
        var author = document.createElement("span"), time = document.createElement("time"), text = document.createElement("p");
        article.className = "message"; meta.className = "meta"; author.className = "author";
        time.className = "sent-at"; text.className = "message-text";
        author.textContent = item.author; time.dateTime = item.created_at;
        time.textContent = new Date(item.created_at).toLocaleTimeString("zh-CN", {hour12: false});
        text.textContent = item.text;
        meta.append(author, time); article.append(meta, text); messages.append(article);
        messages.scrollTop = messages.scrollHeight;
      }
      async function history() {
        try {
          var response = await fetch("/api/messages");
          if (!response.ok) throw new Error();
          (await response.json()).messages.forEach(render);
        } catch (_error) { setConnection("error", "历史记录失败"); }
      }
      function events() {
        var stream = new EventSource("/api/events?after=" + lastId);
        stream.onopen = function () { setConnection("online", "实时连接"); };
        stream.addEventListener("message", function (event) { render(JSON.parse(event.data)); setConnection("online", "实时连接"); });
        stream.onerror = function () { setConnection("checking", "自动重连"); };
      }
      async function checkHealth() {
        try {
          var response = await fetch("/api/health", {cache: "no-store"});
          if (!response.ok) throw new Error();
          health.dataset.state = "online"; healthText.textContent = "服务器在线 · HTTP " + response.status;
        } catch (_error) { health.dataset.state = "error"; healthText.textContent = "服务器连接异常"; }
      }
      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        var author = authorInput.value.trim(), text = messageInput.value.trim();
        if (!author || !text) { formStatus.dataset.state = "error"; formStatus.textContent = "昵称和消息不能为空"; return; }
        send.disabled = true; formStatus.dataset.state = "loading"; formStatus.textContent = "正在发送…";
        try {
          var response = await fetch("/api/messages", {
            method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({author: author, text: text})
          });
          var payload = await response.json();
          if (!response.ok) throw new Error();
          render(payload.message); messageInput.value = ""; formStatus.dataset.state = "success";
          formStatus.textContent = "发送成功"; messageInput.focus();
        } catch (_error) { formStatus.dataset.state = "error"; formStatus.textContent = "发送失败，请检查连接后重试"; }
        finally { send.disabled = false; }
      });
      updateClock(); window.setInterval(updateClock, 250);
      history().then(events); checkHealth(); window.setInterval(checkHealth, 15000);
    }());
  </script>
</body>
</html>
