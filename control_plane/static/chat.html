<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通讯 - 管理后台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header">控制平面</div>
      <div class="nav-menu">
        <a href="#" class="nav-item">概览</a>
        <a href="planner.html" class="nav-item">规划</a>
        <a href="chat.html" class="nav-item active">通讯</a>
        <a href="#" class="nav-item">博客</a>
        <a href="#" class="nav-item">任务</a>
        <a href="#" class="nav-item">设置</a>
      </div>
    </nav>
    <main class="main-content">
      <header class="topbar">
        <h2 style="font-size: 16px;">安全会话</h2>
      </header>
      <div class="chat-layout">
        <div class="chat-sidebar">
          <div class="chat-list-item active">
            <div class="chat-list-name">系统管理员 (Admin)</div>
            <div class="chat-list-preview">部署配置已更新...</div>
          </div>
          <div class="chat-list-item">
            <div class="chat-list-name">Agent-1</div>
            <div class="chat-list-preview">API 测试完成，等待合并。</div>
          </div>
        </div>
        <div class="chat-main">
          <div class="chat-messages">
            <div class="chat-message">
              <div class="chat-message-author">系统管理员 - 今天 10:15</div>
              <div class="chat-message-bubble">
                请确认新的控制平面接口是否已经部署完毕？
              </div>
            </div>
            <div class="chat-message self">
              <div class="chat-message-author">我 - 今天 10:18</div>
              <div class="chat-message-bubble">
                是的，已经完成部署并在 127.0.0.1 端口进行了测试。没有任何报错。
              </div>
            </div>
          </div>
          <div class="chat-input-area">
            <div class="chat-input-box">
              <input type="text" class="input" placeholder="输入消息 (最多4000字)">
              <button class="btn btn-primary">发送</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
